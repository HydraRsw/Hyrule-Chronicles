# Publica una versión nueva del launcher en GitHub Releases.
#
# Se activa al subir una etiqueta vX.Y.Z (publicar.bat lo hace por ti) o a mano
# desde la pestaña Actions › "Publicar versión" › Run workflow.
# Compila el instalador y la versión portable con el icono del proyecto, y los
# sube a la Release. El launcher instalado detecta la versión nueva y se actualiza solo.
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::La etiqueta v$TAG no coincide con la versión de package.json ($PKG)."
            exit 1
          fi

      - name: Instalar dependencias
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Se compila sin publicar y luego se sube todo junto a UNA sola Release.
      # (Si electron-builder publica el instalador y el portable a la vez, puede
      # crear dos Releases con la misma etiqueta.)
      - name: Compilar (instalador + portable)
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          shopt -s nullglob
          FILES=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          ls -l "${FILES[@]}"
          if [ ! -f dist/latest.yml ]; then
            echo "::error::Falta dist/latest.yml: sin él, el launcher no puede actualizarse."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" \
              --title "Hyrule Chronicles $VER" --generate-notes
          fi

      - name: Guardar los .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: hyrule-chronicles-${{ github.ref_name }}
          path: dist/*.exe
          retention-days: 14
