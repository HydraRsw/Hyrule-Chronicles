# Publica una versión nueva del launcher en GitHub Releases.
#
# Se activa al subir una etiqueta vX.Y.Z (publicar.bat lo hace por ti) o a mano
# desde la pestaña Actions › "Publicar versión" › Run workflow.
# Compila el instalador y la versión portable con el icono del proyecto, y los
# sube a la Release. El launcher instalado detecta la versión nueva y se actualiza solo.
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::La etiqueta v$TAG no coincide con la versión de package.json ($PKG)."
            exit 1
          fi

      - name: Instalar dependencias
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compilar y publicar (instalador + portable)
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar los .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: hyrule-chronicles-${{ github.ref_name }}
          path: dist/*.exe
          retention-days: 14
